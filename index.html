<head>
<meta charset="UTF-8">

<title>Courtside Ten — Top 10 NBA Players, 2025‑26</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12141A;
  --panel:#1A1D25;
  --panel-2:#20242E;
  --line: rgba(244,242,237,0.12);
  --chalk:#F4F2ED;
  --chalk-dim: rgba(244,242,237,0.62);
  --amber:#E8963C;
  --flare:#FF5A1F;
  --steel:#465468;
  --a:#4CAF6D;
  --b:#E8C34A;
  --c:#D9743A;
  --d:#C24141;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  background:var(--ink);
  color:var(--chalk);
  font-family:'Inter',sans-serif;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";
  position:fixed; inset:0;
  background-image: repeating-linear-gradient(0deg, rgba(244,242,237,0.025) 0px, rgba(244,242,237,0.025) 1px, transparent 1px, transparent 42px);
  pointer-events:none; z-index:0;
}
.display{font-family:'Anton',sans-serif; text-transform:uppercase; letter-spacing:0.01em;}
.mono{font-family:'JetBrains Mono',monospace;}
a{color:inherit; text-decoration:none;}
::selection{background:var(--flare); color:#12141A;}

/* NAV */
.nav{
  position:sticky; top:0; z-index:50;
  display:flex; align-items:center; justify-content:space-between;
  padding:18px 5vw;
  background:rgba(18,20,26,0.86);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.nav .logo{display:flex; align-items:center; gap:10px; font-size:1.15rem;}
.nav .logo .dot{width:10px; height:10px; background:var(--flare); border-radius:2px; transform:rotate(45deg);}
.nav .logo b{display:block;}
.nav .logo small{display:block; font-family:'Inter',sans-serif; text-transform:none; letter-spacing:0; font-size:0.62rem; color:var(--chalk-dim); font-weight:600;}
.nav .season{font-family:'JetBrains Mono',monospace; font-size:0.78rem; color:var(--amber); border:1px solid rgba(232,150,60,0.4); padding:6px 12px; border-radius:100px;}

main{position:relative; z-index:1; max-width:1120px; margin:0 auto; padding:0 5vw 100px;}

/* HERO */
.hero{padding:64px 0 40px; border-bottom:1px solid var(--line);}
.eyebrow{font-family:'JetBrains Mono',monospace; color:var(--flare); font-size:0.8rem; letter-spacing:0.14em; margin-bottom:14px;}
.hero h1{font-size:clamp(2.6rem,7vw,5.2rem); line-height:0.94; margin:0 0 20px;}
.hero h1 .stroke{-webkit-text-stroke:1.5px var(--chalk); color:transparent;}
.hero p{max-width:620px; color:var(--chalk-dim); font-size:1.05rem; line-height:1.65;}
.hero .meta-row{display:flex; gap:28px; margin-top:32px; flex-wrap:wrap;}
.meta-item{font-family:'JetBrains Mono',monospace; font-size:0.78rem; color:var(--chalk-dim);}
.meta-item b{color:var(--chalk); display:block; font-size:1.1rem; font-family:'Inter',sans-serif; font-weight:800;}

/* METHODOLOGY STRIP */
.method{display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--line); margin:36px 0 0; border:1px solid var(--line);}
.method div{background:var(--panel); padding:16px 18px;}
.method div span{display:block; font-family:'JetBrains Mono',monospace; font-size:0.68rem; color:var(--amber); margin-bottom:6px;}
.method div p{margin:0; font-size:0.83rem; color:var(--chalk-dim); line-height:1.4;}

/* COUNTDOWN LIST */
.list-head{display:flex; justify-content:space-between; align-items:baseline; margin:56px 0 18px;}
.list-head h2{font-size:1.1rem; margin:0; color:var(--chalk-dim); font-weight:600; letter-spacing:0.02em;}
.row{
  display:grid;
  grid-template-columns: 92px 1fr auto auto;
  align-items:center;
  gap:22px;
  padding:22px 18px;
  border-bottom:1px solid var(--line);
  cursor:pointer;
  transition: background 0.15s ease, padding-left 0.15s ease;
  position:relative;
  overflow:hidden;
}
.row:hover{background:var(--panel); padding-left:26px;}
.row::before{
  content:""; position:absolute; left:0; top:0; bottom:0; width:4px;
  background: var(--team, var(--flare)); opacity:0; transition:opacity .15s;
}
.row:hover::before{opacity:1;}
.rank-num{font-family:'Anton',sans-serif; font-size:2.6rem; color:var(--team, var(--steel)); opacity:0.9; line-height:1;}
.row-name h3{margin:0 0 4px; font-size:1.3rem; font-weight:800;}
.row-name .sub{font-family:'JetBrains Mono',monospace; font-size:0.76rem; color:var(--chalk-dim);}
.row-hook{display:none;}
@media(min-width:760px){ .row-hook{display:block; max-width:300px; font-size:0.85rem; color:var(--chalk-dim); line-height:1.4;} }
.grade-pill{
  font-family:'Anton',sans-serif; font-size:1.1rem; width:44px; height:44px;
  border-radius:50%; display:flex; align-items:center; justify-content:center;
  border:2px solid var(--grade-color,var(--b)); color:var(--grade-color,var(--b));
  flex-shrink:0;
}

/* FOOTER */
.site-footer{margin-top:80px; padding-top:28px; border-top:1px solid var(--line); display:flex; justify-content:space-between; flex-wrap:wrap; gap:12px; color:var(--chalk-dim); font-size:0.8rem;}

/* PLAYER PAGE */
.back-link{display:inline-flex; align-items:center; gap:8px; margin:32px 0 0; font-family:'JetBrains Mono',monospace; font-size:0.8rem; color:var(--chalk-dim);}
.back-link:hover{color:var(--amber);}
.p-hero{
  position:relative;
  margin-top:22px;
  padding:46px 34px;
  border:1px solid var(--line);
  border-radius:18px;
  overflow:hidden;
  background: linear-gradient(135deg, var(--team,#20242E) 0%, #14161c 68%);
}
.p-hero .watermark{
  position:absolute; right:-0.05em; top:-0.22em;
  font-family:'Anton',sans-serif; font-size:14rem; color:rgba(255,255,255,0.06);
  line-height:1; pointer-events:none; user-select:none;
}
.p-hero .rank-tag{font-family:'JetBrains Mono',monospace; font-size:0.85rem; background:rgba(0,0,0,0.35); border:1px solid rgba(255,255,255,0.25); padding:6px 14px; border-radius:100px; display:inline-block; margin-bottom:18px;}
.p-hero h1{font-size:clamp(2.4rem,6vw,4.2rem); margin:0 0 6px; position:relative;}
.p-hero .team-line{font-family:'JetBrains Mono',monospace; color:rgba(244,242,237,0.85); font-size:0.95rem; margin-bottom:22px;}
.p-hero .hook{max-width:640px; font-size:1.05rem; line-height:1.6; color:rgba(244,242,237,0.92); position:relative;}

/* report card */
.report-card{
  display:grid; grid-template-columns:repeat(4,1fr); gap:1px;
  background:var(--line); border:1px solid var(--line); margin-top:-1px; border-radius:0 0 18px 18px; overflow:hidden;
}
.report-card .cell{background:#161822; padding:20px 16px; text-align:center;}
.report-card .cell .label{font-family:'JetBrains Mono',monospace; font-size:0.66rem; color:var(--chalk-dim); text-transform:uppercase; letter-spacing:0.08em; margin-bottom:10px;}
.report-card .cell .grade{font-family:'Anton',sans-serif; font-size:2.1rem; color:var(--grade-color);}
@media(max-width:640px){.report-card{grid-template-columns:repeat(2,1fr);}}

/* stat bars */
.section-title{font-family:'JetBrains Mono',monospace; color:var(--amber); font-size:0.78rem; letter-spacing:0.1em; margin:52px 0 18px; display:flex; align-items:center; gap:10px;}
.section-title::after{content:""; flex:1; height:1px; background:var(--line);}
.stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:14px;}
.stat-box{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px;}
.stat-box .v{font-family:'Anton',sans-serif; font-size:1.9rem; color:var(--chalk);}
.stat-box .k{font-family:'JetBrains Mono',monospace; font-size:0.7rem; color:var(--chalk-dim); margin-top:2px;}
.bar-row{display:grid; grid-template-columns:120px 1fr 56px; align-items:center; gap:14px; margin-bottom:14px;}
.bar-row .lbl{font-size:0.85rem; color:var(--chalk-dim); font-family:'JetBrains Mono',monospace;}
.bar-track{height:10px; background:var(--panel-2); border-radius:6px; overflow:hidden; border:1px solid var(--line);}
.bar-fill{height:100%; background:linear-gradient(90deg, var(--team,var(--amber)), var(--flare));}
.bar-row .pct{font-family:'JetBrains Mono',monospace; font-size:0.78rem; color:var(--chalk-dim); text-align:right;}

.prose p{line-height:1.75; color:var(--chalk-dim); font-size:1rem; margin:0 0 18px;}
.prose strong{color:var(--chalk); font-weight:700;}
.achv-list{list-style:none; margin:0; padding:0; display:grid; gap:10px;}
.achv-list li{display:flex; gap:12px; align-items:flex-start; font-size:0.95rem; color:var(--chalk-dim); line-height:1.5;}
.achv-list li::before{content:"▸"; color:var(--amber); flex-shrink:0;}

.pager{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:60px;}
.pager a{border:1px solid var(--line); border-radius:14px; padding:20px 22px; display:block; transition:border-color .15s, background .15s;}
.pager a:hover{border-color:var(--amber); background:var(--panel);}
.pager .dir{font-family:'JetBrains Mono',monospace; font-size:0.7rem; color:var(--chalk-dim); margin-bottom:6px;}
.pager .nm{font-weight:800; font-size:1.1rem;}
.pager .next{text-align:right;}
@media(max-width:600px){.pager{grid-template-columns:1fr;}}

@media (prefers-reduced-motion: reduce){ *{transition:none !important; scroll-behavior:auto !important;} }
</style>
</head>

  hook:"A breakout, All‑NBA‑caliber season that turned into real playoff results — Maxey outlasted Boston in the first round before pushing eventual‑champion New York in the second.",
  grades:{raw:"B+", advanced:"B", playoffs:"B+", achievements:"B+", overall:"B"},
  stats:[["Scoring volume","86%"],["Playmaking growth","82%"],["Playoff result","80%"]],
  statBoxes:[["Third Team","All‑NBA"],["Round 1","won vs. Boston"],["Round 2","vs. NY Knicks"],["Career-best","season"]],
  narrative:[
    "Maxey's game took another step forward this season, adding enough shot creation and playmaking to his elite speed and shooting to land his first career All‑NBA selection on the Third Team.",
    "Philadelphia rode that growth to a first‑round upset over Boston, ending the Celtics' season in seven games, before running into the eventual champion Knicks in the second round.",
    "It's the kind of season — real individual growth plus a real playoff run against a title team — that belongs in any top‑ten conversation built on the full body of work rather than reputation alone."
  ],
  achievements:["Kia All‑NBA Third Team, first career selection","Helped eliminate Boston in the first round of the playoffs","Pushed the eventual NBA champion Knicks in the second round"]
}
];

const GRADE_COLOR = g => {
  if(!g) return "var(--b)";
  const l = g[0];
  if(l==="A") return "var(--a)";
  if(l==="B") return "var(--b)";
  if(l==="C") return "var(--c)";
  return "var(--d)";
};

function renderHome(){
  const rows = PLAYERS.slice().sort((a,b)=>a.rank-b.rank).map(p=>`
    <a href="#/player/${p.slug}" class="row" style="--team:${p.color}">
      <div class="rank-num">${p.rank}</div>
      <div class="row-name">
        <h3>${p.name}</h3>
        <div class="sub">${p.team} · ${p.pos}</div>
      </div>
      <div class="row-hook">${p.hook}</div>
      <div class="grade-pill" style="--grade-color:${GRADE_COLOR(p.grades.overall)}">${p.grades.overall}</div>
    </a>
  `).join("");

  return `
    <section class="hero">
      <div class="eyebrow">// 2025–26 SEASON REVIEW</div>
      <h1>TOP <span class="stroke">10</span><br>NBA PLAYERS<br>RIGHT NOW</h1>
      <p>A ranked, graded breakdown of the ten players who defined this NBA season — weighted first on the full 82‑game body of work (raw box scores, advanced efficiency, All‑NBA voting), then on what each player did in the playoffs. Team success only counts toward a player's own grade, not a teammate's. Click into any player for the full report.</p>
      <div class="meta-row">
        <div class="meta-item">CHAMPION<b>New York Knicks</b></div>
        <div class="meta-item">MVP<b>Shai Gilgeous‑Alexander</b></div>
        <div class="meta-item">SCORING LEADER<b>Luka Dončić</b></div>
        <div class="meta-item">FINALS MVP<b>Jalen Brunson</b></div>
      </div>
      <div class="method">
        <div><span>RAW STATS</span><p>Per‑game scoring, rebounding, and playmaking volume.</p></div>
        <div><span>ADVANCED STATS</span><p>Efficiency, true shooting, and impact metrics.</p></div>
        <div><span>PLAYOFF SUCCESS</span><p>How far they went, and how they performed when it mattered.</p></div>
        <div><span>ACHIEVEMENTS</span><p>Awards, All‑NBA nods, and hardware earned this season.</p></div>
      </div>
    </section>
    <div class="list-head">
      <h2 class="mono">THE COUNTDOWN — TAP ANY PLAYER FOR THE FULL REPORT</h2>
    </div>
    <div class="list">${rows}</div>
    <footer class="site-footer">
      <div>Courtside Ten — independent 2025‑26 season analysis &amp; grading.</div>
      <div>Grades reflect editorial judgment, not official NBA scoring.</div>
    </footer>
  `;
}

function renderPlayer(slug){
  const list = PLAYERS.slice().sort((a,b)=>a.rank-b.rank);
  const idx = list.findIndex(p=>p.slug===slug);
  if(idx===-1) return `<div style="padding:80px 0;">Player not found. <a href="#/" class="mono" style="color:var(--amber);">Back to countdown →</a></div>`;
  const p = list[idx];
  const prev = list[(idx-1+list.length)%list.length];
  const next = list[(idx+1)%list.length];

  const bars = p.stats.map(([label,pct])=>`
    <div class="bar-row">
      <div class="lbl">${label}</div>
      <div class="bar-track"><div class="bar-fill" style="--team:${p.color}; width:${pct};"></div></div>
      <div class="pct">${pct}</div>
    </div>
  `).join("");

  const boxes = p.statBoxes.map(([v,k])=>`
    <div class="stat-box"><div class="v">${v}</div><div class="k">${k}</div></div>
  `).join("");

  const narrative = p.narrative.map(par=>`<p>${par}</p>`).join("");
  const achv = p.achievements.map(a=>`<li>${a}</li>`).join("");
  const cells = ["raw","advanced","playoffs","achievements"].map(key=>{
    const label = {raw:"Raw Stats",advanced:"Advanced",playoffs:"Playoffs",achievements:"Achievements"}[key];
    const g = p.grades[key];
    return `<div class="cell" style="--grade-color:${GRADE_COLOR(g)}"><div class="label">${label}</div><div class="grade">${g}</div></div>`;
  }).join("");

  return `
    <a href="#/" class="back-link">← BACK TO THE COUNTDOWN</a>
    <div class="p-hero" style="--team:${p.color}">
      <div class="watermark">${p.rank}</div>
      <div class="rank-tag mono">RANK #${p.rank} OF 10</div>
      <h1>${p.name}</h1>
      <div class="team-line mono">${p.team} · ${p.pos}</div>
      <div class="hook">${p.hook}</div>
    </div>
    <div class="report-card">${cells}</div>

    <div class="section-title">SEASON SNAPSHOT</div>
    <div class="stat-grid">${boxes}</div>

    <div class="section-title">SCOUTING BREAKDOWN</div>
    ${bars}

    <div class="section-title">THE FULL REPORT</div>
    <div class="prose">${narrative}</div>

    <div class="section-title">AWARDS &amp; ACHIEVEMENTS</div>
    <ul class="achv-list">${achv}</ul>

    <div class="pager">
      <a href="#/player/${prev.slug}"><div class="dir mono">← PREVIOUS · #${prev.rank}</div><div class="nm">${prev.name}</div></a>
      <a href="#/player/${next.slug}" class="next"><div class="dir mono">NEXT · #${next.rank} →</div><div class="nm">${next.name}</div></a>
    </div>
    <footer class="site-footer">
      <div>Courtside Ten — independent 2025‑26 season analysis &amp; grading.</div>
      <div>Grades reflect editorial judgment, not official NBA scoring.</div>
    </footer>
  `;
}

function router(){
  const hash = location.hash || "#/";
  const app = document.getElementById("app");
  const playerMatch = hash.match(/^#\/player\/([a-z0-9-]+)/);
  if(playerMatch){
    app.innerHTML = renderPlayer(playerMatch[1]);
  } else {
    app.innerHTML = renderHome();
  }
  window.scrollTo({top:0, behavior:"instant"});
}
window.addEventListener("hashchange", router);
window.addEventListener("DOMContentLoaded", router);
</script>
</body>
</html>
