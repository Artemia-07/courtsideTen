<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Courtside Ten — NBA Rankings, Grades &amp; Analysis</title>
<meta name="description" content="Courtside Ten is a home for ranked, graded breakdowns of basketball's best — countdowns, player report cards, and analysis, with new lists added all the time.">
<meta property="og:title" content="Courtside Ten — NBA Rankings, Grades & Analysis">
<meta property="og:description" content="Ranked, graded countdowns of basketball's best players, built from raw stats, advanced metrics, and playoff results.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12141A;
  --panel:#1A1D25;
  --panel-2:#20242E;
  --line: rgba(244,242,237,0.12);
  --chalk:#F4F2ED;
  --chalk-dim: rgba(244,242,237,0.62);
  --amber:#E8963C;
  --flare:#FF5A1F;
  --steel:#465468;
  --a:#4CAF6D;
  --b:#E8C34A;
  --c:#D9743A;
  --d:#C24141;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  background:var(--ink);
  color:var(--chalk);
  font-family:'Inter',sans-serif;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";
  position:fixed; inset:0;
  background-image: repeating-linear-gradient(0deg, rgba(244,242,237,0.025) 0px, rgba(244,242,237,0.025) 1px, transparent 1px, transparent 42px);
  pointer-events:none; z-index:0;
}
.display{font-family:'Anton',sans-serif; text-transform:uppercase; letter-spacing:0.01em;}
.mono{font-family:'JetBrains Mono',monospace;}
a{color:inherit; text-decoration:none;}
::selection{background:var(--flare); color:#12141A;}
button, input, textarea{font-family:inherit;}

/* NAV */
.nav{
  position:sticky; top:0; z-index:50;
  display:flex; align-items:center; justify-content:space-between;
  gap:20px; flex-wrap:wrap;
  padding:16px 5vw;
  background:rgba(18,20,26,0.9);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.nav .logo{display:flex; align-items:center; gap:10px; font-size:1.15rem;}
.nav .logo .dot{width:10px; height:10px; background:var(--flare); border-radius:2px; transform:rotate(45deg); flex-shrink:0;}
.nav .logo b{display:block;}
.nav .logo small{display:block; font-family:'Inter',sans-serif; text-transform:none; letter-spacing:0; font-size:0.62rem; color:var(--chalk-dim); font-weight:600;}
.nav-links{display:flex; gap:24px; flex-wrap:wrap;}
.nav-links a{font-size:0.78rem; color:var(--chalk-dim); letter-spacing:0.02em; padding:4px 1px; border-bottom:2px solid transparent; transition:color .15s, border-color .15s;}
.nav-links a:hover{color:var(--chalk);}
.nav-links a.active{color:var(--amber); border-color:var(--amber);}
.nav .season{font-family:'JetBrains Mono',monospace; font-size:0.75rem; color:var(--amber); border:1px solid rgba(232,150,60,0.4); padding:6px 12px; border-radius:100px; white-space:nowrap;}
@media(max-width:640px){ .nav .season{display:none;} }

main{position:relative; z-index:1; max-width:1120px; margin:0 auto; padding:0 5vw 100px;}

/* HERO */
.hero{padding:64px 0 40px; border-bottom:1px solid var(--line);}
.eyebrow{font-family:'JetBrains Mono',monospace; color:var(--flare); font-size:0.8rem; letter-spacing:0.14em; margin-bottom:14px;}
.hero h1{font-size:clamp(2.6rem,7vw,5.2rem); line-height:0.94; margin:0 0 20px;}
.hero h1 .stroke{-webkit-text-stroke:1.5px var(--chalk); color:transparent;}
.hero p{max-width:640px; color:var(--chalk-dim); font-size:1.05rem; line-height:1.65;}
.hero .meta-row{display:flex; gap:28px; margin-top:32px; flex-wrap:wrap;}
.meta-item{font-family:'JetBrains Mono',monospace; font-size:0.78rem; color:var(--chalk-dim);}
.meta-item b{color:var(--chalk); display:block; font-size:1.1rem; font-family:'Inter',sans-serif; font-weight:800;}

/* Smaller page hero (about/contact/news) */
.page-hero{padding:56px 0 34px; border-bottom:1px solid var(--line);}
.page-hero h1{font-size:clamp(2.1rem,5.5vw,3.4rem); line-height:1.02; margin:0 0 16px;}
.page-hero p{max-width:640px; color:var(--chalk-dim); font-size:1.02rem; line-height:1.65;}

/* METHODOLOGY STRIP */
.method{display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--line); margin:36px 0 0; border:1px solid var(--line);}
.method div{background:var(--panel); padding:16px 18px;}
.method div span{display:block; font-family:'JetBrains Mono',monospace; font-size:0.68rem; color:var(--amber); margin-bottom:6px;}
.method div p{margin:0; font-size:0.83rem; color:var(--chalk-dim); line-height:1.4;}

/* COUNTDOWN LIST */
.list-head{display:flex; justify-content:space-between; align-items:baseline; margin:56px 0 18px; flex-wrap:wrap; gap:10px;}
.list-head h2{font-size:1.1rem; margin:0; color:var(--chalk-dim); font-weight:600; letter-spacing:0.02em;}
.row{
  display:grid;
  grid-template-columns: 92px 1fr auto auto;
  align-items:center;
  gap:22px;
  padding:22px 18px;
  border-bottom:1px solid var(--line);
  cursor:pointer;
  transition: background 0.15s ease, padding-left 0.15s ease;
  position:relative;
  overflow:hidden;
}
.row:hover{background:var(--panel); padding-left:26px;}
.row::before{
  content:""; position:absolute; left:0; top:0; bottom:0; width:4px;
  background: var(--team, var(--flare)); opacity:0; transition:opacity .15s;
}
.row:hover::before{opacity:1;}
.rank-num{font-family:'Anton',sans-serif; font-size:2.6rem; color:var(--team, var(--steel)); opacity:0.9; line-height:1;}
.row-name h3{margin:0 0 4px; font-size:1.3rem; font-weight:800;}
.row-name .sub{font-family:'JetBrains Mono',monospace; font-size:0.76rem; color:var(--chalk-dim);}
.row-hook{display:none;}
@media(min-width:760px){ .row-hook{display:block; max-width:300px; font-size:0.85rem; color:var(--chalk-dim); line-height:1.4;} }
.grade-pill{
  font-family:'Anton',sans-serif; font-size:1.1rem; width:44px; height:44px;
  border-radius:50%; display:flex; align-items:center; justify-content:center;
  border:2px solid var(--grade-color,var(--b)); color:var(--grade-color,var(--b));
  flex-shrink:0;
}

/* FOOTER */
.site-footer{margin-top:80px; padding-top:28px; border-top:1px solid var(--line); display:flex; justify-content:space-between; flex-wrap:wrap; gap:16px; color:var(--chalk-dim); font-size:0.8rem;}
.site-footer .fcols{display:flex; gap:48px; flex-wrap:wrap;}
.site-footer .fcol b{display:block; color:var(--chalk); font-size:0.78rem; margin-bottom:10px; font-family:'JetBrains Mono',monospace; letter-spacing:0.06em;}
.site-footer .fcol a{display:block; margin-bottom:6px; color:var(--chalk-dim);}
.site-footer .fcol a:hover{color:var(--amber);}
.site-footer .fbottom{width:100%; margin-top:20px; padding-top:16px; border-top:1px solid var(--line); font-size:0.74rem;}

/* PLAYER PAGE */
.back-link{display:inline-flex; align-items:center; gap:8px; margin:32px 0 0; font-family:'JetBrains Mono',monospace; font-size:0.8rem; color:var(--chalk-dim);}
.back-link:hover{color:var(--amber);}
.p-hero{
  position:relative;
  margin-top:22px;
  padding:46px 34px;
  border:1px solid var(--line);
  border-radius:18px;
  overflow:hidden;
  background: linear-gradient(135deg, var(--team,#20242E) 0%, #14161c 68%);
}
.p-hero .watermark{
  position:absolute; right:-0.05em; top:-0.22em;
  font-family:'Anton',sans-serif; font-size:14rem; color:rgba(255,255,255,0.06);
  line-height:1; pointer-events:none; user-select:none;
}
.p-hero .rank-tag{font-family:'JetBrains Mono',monospace; font-size:0.85rem; background:rgba(0,0,0,0.35); border:1px solid rgba(255,255,255,0.25); padding:6px 14px; border-radius:100px; display:inline-block; margin-bottom:18px;}
.p-hero h1{font-size:clamp(2.4rem,6vw,4.2rem); margin:0 0 6px; position:relative;}
.p-hero .team-line{font-family:'JetBrains Mono',monospace; color:rgba(244,242,237,0.85); font-size:0.95rem; margin-bottom:22px;}
.p-hero .hook{max-width:640px; font-size:1.05rem; line-height:1.6; color:rgba(244,242,237,0.92); position:relative;}

/* report card */
.report-card{
  display:grid; grid-template-columns:repeat(4,1fr); gap:1px;
  background:var(--line); border:1px solid var(--line); margin-top:-1px; border-radius:0 0 18px 18px; overflow:hidden;
}
.report-card .cell{background:#161822; padding:20px 16px; text-align:center;}
.report-card .cell .label{font-family:'JetBrains Mono',monospace; font-size:0.66rem; color:var(--chalk-dim); text-transform:uppercase; letter-spacing:0.08em; margin-bottom:10px;}
.report-card .cell .grade{font-family:'Anton',sans-serif; font-size:2.1rem; color:var(--grade-color);}
@media(max-width:640px){.report-card{grid-template-columns:repeat(2,1fr);}}

/* stat bars */
.section-title{font-family:'JetBrains Mono',monospace; color:var(--amber); font-size:0.78rem; letter-spacing:0.1em; margin:52px 0 18px; display:flex; align-items:center; gap:10px;}
.section-title::after{content:""; flex:1; height:1px; background:var(--line);}
.stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:14px;}
.stat-box{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px;}
.stat-box .v{font-family:'Anton',sans-serif; font-size:1.9rem; color:var(--chalk);}
.stat-box .k{font-family:'JetBrains Mono',monospace; font-size:0.7rem; color:var(--chalk-dim); margin-top:2px;}
.bar-row{display:grid; grid-template-columns:120px 1fr 56px; align-items:center; gap:14px; margin-bottom:14px;}
.bar-row .lbl{font-size:0.85rem; color:var(--chalk-dim); font-family:'JetBrains Mono',monospace;}
.bar-track{height:10px; background:var(--panel-2); border-radius:6px; overflow:hidden; border:1px solid var(--line);}
.bar-fill{height:100%; background:linear-gradient(90deg, var(--team,var(--amber)), var(--flare));}
.bar-row .pct{font-family:'JetBrains Mono',monospace; font-size:0.78rem; color:var(--chalk-dim); text-align:right;}

.prose p{line-height:1.75; color:var(--chalk-dim); font-size:1rem; margin:0 0 18px;}
.prose strong{color:var(--chalk); font-weight:700;}
.achv-list{list-style:none; margin:0; padding:0; display:grid; gap:10px;}
.achv-list li{display:flex; gap:12px; align-items:flex-start; font-size:0.95rem; color:var(--chalk-dim); line-height:1.5;}
.achv-list li::before{content:"▸"; color:var(--amber); flex-shrink:0;}

.pager{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:60px;}
.pager a{border:1px solid var(--line); border-radius:14px; padding:20px 22px; display:block; transition:border-color .15s, background .15s;}
.pager a:hover{border-color:var(--amber); background:var(--panel);}
.pager .dir{font-family:'JetBrains Mono',monospace; font-size:0.7rem; color:var(--chalk-dim); margin-bottom:6px;}
.pager .nm{font-weight:800; font-size:1.1rem;}
.pager .next{text-align:right;}
@media(max-width:600px){.pager{grid-template-columns:1fr;}}

/* HUB / RANKINGS ARCHIVE */
.hub-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(270px,1fr)); gap:18px; margin-top:28px;}
.hub-card{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:26px; position:relative; transition:border-color .15s, transform .15s;}
.hub-card:hover{border-color:var(--amber); transform:translateY(-3px);}
.hub-card .badge{font-family:'JetBrains Mono',monospace; font-size:0.66rem; color:var(--amber); letter-spacing:0.08em; display:block; margin-bottom:12px;}
.hub-card h3{font-size:1.25rem; margin:0 0 10px; line-height:1.25;}
.hub-card p{color:var(--chalk-dim); font-size:0.86rem; line-height:1.5; margin:0 0 18px;}
.hub-card .cta{font-family:'JetBrains Mono',monospace; font-size:0.72rem; color:var(--flare); font-weight:700;}
.hub-card.soon{opacity:0.5; cursor:default;}
.hub-card.soon:hover{border-color:var(--line); transform:none;}
.hub-card.soon .cta{color:var(--steel);}

/* SPOTLIGHT (featured ranking on homepage) */
.spotlight{margin-top:28px; padding:42px 36px; border:1px solid var(--line); border-radius:18px; background:linear-gradient(135deg, var(--panel-2), var(--panel) 75%); position:relative; overflow:hidden;}
.spotlight .tag{font-family:'JetBrains Mono',monospace; font-size:0.72rem; color:var(--amber); margin-bottom:14px; display:inline-block;}
.spotlight h2{font-size:clamp(1.6rem,4vw,2.3rem); margin:0 0 14px; line-height:1.1;}
.spotlight p{color:var(--chalk-dim); max-width:600px; line-height:1.6; margin:0 0 24px;}
.spotlight .btn{display:inline-flex; align-items:center; gap:8px; font-family:'JetBrains Mono',monospace; font-size:0.8rem; color:var(--ink); background:var(--amber); padding:12px 22px; border-radius:100px; font-weight:700; transition:background .15s;}
.spotlight .btn:hover{background:var(--flare);}

/* HONORABLE MENTIONS */
.hm-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:16px; margin-top:8px;}
.hm-card{background:var(--panel); border:1px solid var(--line); border-top:3px solid var(--team,var(--steel)); border-radius:12px; padding:20px;}
.hm-card.asterisk{border-top-color:var(--flare); opacity:0.9;}
.hm-tag{font-size:0.66rem; color:var(--amber); letter-spacing:0.08em; display:block; margin-bottom:8px;}
.hm-card.asterisk .hm-tag{color:var(--flare);}
.hm-card h4{margin:0 0 4px; font-size:1.1rem;}
.hm-team{font-size:0.74rem; color:var(--chalk-dim); margin-bottom:12px;}
.hm-card p{margin:0; font-size:0.87rem; color:var(--chalk-dim); line-height:1.55;}
.hm-asterisk-note{font-family:'JetBrains Mono',monospace; font-size:0.74rem; color:var(--chalk-dim); margin:0 0 16px;}

/* AD SLOT */
.ad-slot{border:1px dashed var(--line); border-radius:12px; padding:26px; text-align:center; color:var(--chalk-dim); font-family:'JetBrains Mono',monospace; font-size:0.7rem; letter-spacing:0.1em; text-transform:uppercase; margin:52px 0;}
.ad-slot span{display:block; margin-top:4px; font-size:0.64rem; opacity:0.55; letter-spacing:0.04em; text-transform:none;}

/* NEWS */
.news-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(270px,1fr)); gap:18px; margin-top:8px;}
.news-card{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:22px; transition:border-color .15s, transform .15s;}
.news-card:hover{border-color:var(--amber); transform:translateY(-2px);}
.news-card .cat{font-family:'JetBrains Mono',monospace; font-size:0.66rem; color:var(--flare); letter-spacing:0.08em; margin-bottom:10px; display:block;}
.news-card h3{margin:0 0 8px; font-size:1.12rem; line-height:1.3;}
.news-card p{margin:0; color:var(--chalk-dim); font-size:0.87rem; line-height:1.5;}
.news-card .date{margin-top:16px; font-family:'JetBrains Mono',monospace; font-size:0.68rem; color:var(--steel);}
.article-meta{font-family:'JetBrains Mono',monospace; font-size:0.76rem; color:var(--chalk-dim); margin:18px 0 40px; display:flex; gap:18px; flex-wrap:wrap;}
.article-meta span{color:var(--amber);}

/* ABOUT / CONTACT */
.info-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; margin:30px 0;}
.info-box{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:20px;}
.info-box .v{font-family:'Anton',sans-serif; font-size:1.8rem; color:var(--amber);}
.info-box .k{font-family:'JetBrains Mono',monospace; font-size:0.7rem; color:var(--chalk-dim); margin-top:4px;}
.page-section{margin:48px 0;}
.page-section h2{font-size:1.4rem; margin:0 0 16px;}
.page-section p{color:var(--chalk-dim); line-height:1.7; max-width:680px; margin:0 0 14px;}
.contact-form{display:grid; gap:14px; max-width:480px; margin-top:24px;}
.contact-form label{font-family:'JetBrains Mono',monospace; font-size:0.72rem; color:var(--chalk-dim); margin-bottom:6px; display:block; letter-spacing:0.04em;}
.contact-form input, .contact-form textarea{width:100%; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 14px; color:var(--chalk); font-size:0.92rem;}
.contact-form input:focus, .contact-form textarea:focus{outline:none; border-color:var(--amber);}
.contact-form textarea{resize:vertical; min-height:110px;}
.contact-form button{justify-self:start; background:var(--amber); color:var(--ink); border:none; padding:13px 26px; border-radius:100px; font-weight:800; font-size:0.85rem; cursor:pointer; transition:background .15s;}
.contact-form button:hover{background:var(--flare);}
.form-note{font-family:'JetBrains Mono',monospace; font-size:0.72rem; color:var(--steel); margin-top:12px;}
.contact-alt{margin-top:36px; display:flex; gap:40px; flex-wrap:wrap;}
.contact-alt div b{display:block; font-family:'JetBrains Mono',monospace; font-size:0.7rem; color:var(--amber); margin-bottom:6px; letter-spacing:0.06em;}

.not-found{padding:100px 0; text-align:center;}
.not-found h1{font-size:3rem; margin-bottom:14px;}

@media (prefers-reduced-motion: reduce){ *{transition:none !important; scroll-behavior:auto !important;} }
</style>
</head>

const GRADE_COLOR = g => {
  if(!g) return "var(--b)";
  const l = g[0];
  if(l==="A") return "var(--a)";
  if(l==="B") return "var(--b)";
  if(l==="C") return "var(--c)";
  return "var(--d)";
};

  return RANKINGS.find(r=>r.id===id);
}

/* ---------- HOME (site homepage) ---------- */
function renderHub(){
  document.title = "Courtside Ten — NBA Rankings, Grades & Analysis";
  const live = RANKINGS.filter(r=>r.status==="live");
  const soonCount = RANKINGS.filter(r=>r.status==="soon").length;
  const featured = live[0];

  const previewCards = RANKINGS.slice(0,3).map(r=>hubCard(r)).join("");
  const newsPreview = NEWS.slice(0,3).map(n=>newsCard(n)).join("");

  return `
    <section class="hero">
      <div class="eyebrow">// WELCOME TO COURTSIDE TEN</div>
      <h1>RANKING THE<br>GAME, <span class="stroke">10</span><br>AT A TIME</h1>
      <p>Courtside Ten builds ranked, graded countdowns of basketball's best — players, seasons, and eras — using a transparent mix of raw stats, advanced metrics, and playoff results. One list lives here today. Many more are on the way.</p>
      <div class="meta-row">
        <div class="meta-item">LIVE RANKINGS<b>${live.length}</b></div>
        <div class="meta-item">PLAYERS GRADED<b>${featured ? featured.players.length : 0}</b></div>
        <div class="meta-item">COMING SOON<b>${soonCount}</b></div>
        <div class="meta-item">CURRENT SEASON<b>2025–26</b></div>
      </div>
    </section>

    ${featured ? `
    <div class="spotlight">
      <span class="tag mono">FEATURED RANKING</span>
      <h2 class="display">${featured.title}</h2>
      <p>${featured.blurb}</p>
      <a href="#/rankings/${featured.id}" class="btn">See the full countdown →</a>
    </div>` : ""}

    ${adSlot()}

    <div class="list-head">
      <h2 class="mono">MORE RANKINGS</h2>
      <a href="#/rankings" class="mono" style="color:var(--amber); font-size:0.8rem;">View all rankings →</a>
    </div>
    <div class="hub-grid">${previewCards}</div>

    <div class="list-head">
      <h2 class="mono">FROM THE BLOG</h2>
      <a href="#/news" class="mono" style="color:var(--amber); font-size:0.8rem;">View all articles →</a>
    </div>
    <div class="news-grid">${newsPreview}</div>

    ${siteFooter()}
  `;
}

function hubCard(r){
  const isLive = r.status === "live";
  const href = isLive ? `href="#/rankings/${r.id}"` : "";
  return `
    <a ${href} class="hub-card ${isLive ? "" : "soon"}">
      <span class="badge mono">${r.badge}</span>
      <h3>${r.title}</h3>
      <p>${r.blurb}</p>
      <div class="cta mono">${isLive ? "See the countdown →" : "Coming soon"}</div>
    </a>
  `;
}

function newsCard(n){
  return `
    <a href="#/news/${n.slug}" class="news-card">
      <span class="cat mono">${n.category}</span>
      <h3>${n.title}</h3>
      <p>${n.excerpt}</p>
      <div class="date">${n.date}</div>
    </a>
  `;
}

/* ---------- RANKINGS ARCHIVE ---------- */
function renderRankingsIndex(){
  document.title = "All Rankings | Courtside Ten";
  const cards = RANKINGS.map(r=>hubCard(r)).join("");
  return `
    <section class="page-hero">
      <div class="eyebrow">// THE ARCHIVE</div>
      <h1 class="display">EVERY LIST,<br>ONE GROWING ARCHIVE</h1>
      <p>Every countdown Courtside Ten has published — or is currently building — lives here. New rankings get added to this page as soon as they go live.</p>
    </section>
    <div class="hub-grid" style="margin-top:36px;">${cards}</div>
    ${adSlot()}
    ${siteFooter()}
  `;
}

/* ---------- RANKING DETAIL (the countdown itself) ---------- */
function renderRanking(id){
  const ranking = findRanking(id);
  if(!ranking || ranking.status !== "live"){
    return notFoundBlock("That ranking isn't live yet.", "#/rankings", "← Back to all rankings");
  }
  document.title = ranking.title + " | Courtside Ten";
  const list = ranking.players.slice().sort((a,b)=>a.rank-b.rank);
  const rows = list.map(p=>`
    <a href="#/rankings/${ranking.id}/player/${p.slug}" class="row" style="--team:${p.color}">
      <div class="rank-num">${p.rank}</div>
      <div class="row-name">
        <h3>${p.name}</h3>
        <div class="sub">${p.team} · ${p.pos}</div>
      </div>
      <div class="row-hook">${p.hook}</div>
      <div class="grade-pill" style="--grade-color:${GRADE_COLOR(p.grades.overall)}">${p.grades.overall}</div>
    </a>
  `).join("");

  const metaRow = ranking.meta.map(([k,v])=>`<div class="meta-item">${k}<b>${v}</b></div>`).join("");
  const methodRow = ranking.method.map(([k,v])=>`<div><span>${k}</span><p>${v}</p></div>`).join("");

  const hmSection = (ranking.honorableMentions && ranking.honorableMentions.length) ? `
    <div class="section-title">HONORABLE MENTIONS</div>
    <div class="hm-grid">
      ${ranking.honorableMentions.map(h=>`
        <div class="hm-card" style="--team:${h.color || 'var(--amber)'}">
          <span class="hm-tag mono">${h.tag}</span>
          <h4>${h.name}</h4>
          <div class="hm-team mono">${h.team}</div>
          <p>${h.note}</p>
        </div>
      `).join("")}
    </div>
  ` : "";

  const missedSection = (ranking.missedTime && ranking.missedTime.length) ? `
    <div class="section-title">JUST MISSED — MISSED SIGNIFICANT TIME*</div>
    ${ranking.missedTimeNote ? `<p class="hm-asterisk-note">*${ranking.missedTimeNote}</p>` : ""}
    <div class="hm-grid">
      ${ranking.missedTime.map(h=>`
        <div class="hm-card asterisk">
          <span class="hm-tag mono">MISSED TIME</span>
          <h4>${h.name}</h4>
          <div class="hm-team mono">${h.team}</div>
          <p>${h.note}</p>
        </div>
      `).join("")}
    </div>
  ` : "";

  return `
    <a href="#/rankings" class="back-link">← ALL RANKINGS</a>
    <section class="hero">
      <div class="eyebrow">${ranking.eyebrow}</div>
      <h1>${ranking.headline.join("<br>")}</h1>
      <p>${ranking.blurb} Click into any player for the full report.</p>
      <div class="meta-row">${metaRow}</div>
      <div class="method">${methodRow}</div>
    </section>
    <div class="list-head">
      <h2 class="mono">THE COUNTDOWN — TAP ANY PLAYER FOR THE FULL REPORT</h2>
    </div>
    <div class="list">${rows}</div>
    ${adSlot()}
    ${hmSection}
    ${missedSection}
    ${siteFooter()}
  `;
}

/* ---------- PLAYER PAGE ---------- */
function renderPlayer(rankingId, slug){
  const ranking = findRanking(rankingId);
  if(!ranking || ranking.status !== "live"){
    return notFoundBlock("That ranking isn't live yet.", "#/rankings", "← Back to all rankings");
  }
  const list = ranking.players.slice().sort((a,b)=>a.rank-b.rank);
  const idx = list.findIndex(p=>p.slug===slug);
  if(idx===-1){
    return notFoundBlock("Player not found.", `#/rankings/${ranking.id}`, "← Back to the countdown");
  }
  const p = list[idx];
  document.title = `${p.name} — #${p.rank} | ${ranking.title} | Courtside Ten`;
  const prev = list[(idx-1+list.length)%list.length];
  const next = list[(idx+1)%list.length];

  const bars = p.stats.map(([label,pct])=>`
    <div class="bar-row">
      <div class="lbl">${label}</div>
      <div class="bar-track"><div class="bar-fill" style="--team:${p.color}; width:${pct};"></div></div>
      <div class="pct">${pct}</div>
    </div>
  `).join("");

  const boxes = p.statBoxes.map(([v,k])=>`
    <div class="stat-box"><div class="v">${v}</div><div class="k">${k}</div></div>
  `).join("");

  const narrative = p.narrative.map(par=>`<p>${par}</p>`).join("");
  const achv = p.achievements.map(a=>`<li>${a}</li>`).join("");
  const cells = ranking.gradeCategories.map(([key,label])=>{
    const g = p.grades[key];
    return `<div class="cell" style="--grade-color:${GRADE_COLOR(g)}"><div class="label">${label}</div><div class="grade">${g}</div></div>`;
  }).join("");

  return `
    <a href="#/rankings/${ranking.id}" class="back-link">← BACK TO THE COUNTDOWN</a>
    <div class="p-hero" style="--team:${p.color}">
      <div class="watermark">${p.rank}</div>
      <div class="rank-tag mono">RANK #${p.rank} OF ${list.length}</div>
      <h1>${p.name}</h1>
      <div class="team-line mono">${p.team} · ${p.pos}</div>
      <div class="hook">${p.hook}</div>
    </div>
    <div class="report-card">${cells}</div>

    <div class="section-title">SEASON SNAPSHOT</div>
    <div class="stat-grid">${boxes}</div>

    <div class="section-title">SCOUTING BREAKDOWN</div>
    ${bars}

    <div class="section-title">THE FULL REPORT</div>
    <div class="prose">${narrative}</div>

    ${adSlot()}

    <div class="section-title">AWARDS &amp; ACHIEVEMENTS</div>
    <ul class="achv-list">${achv}</ul>

    <div class="pager">
      <a href="#/rankings/${ranking.id}/player/${prev.slug}"><div class="dir mono">← PREVIOUS · #${prev.rank}</div><div class="nm">${prev.name}</div></a>
      <a href="#/rankings/${ranking.id}/player/${next.slug}" class="next"><div class="dir mono">NEXT · #${next.rank} →</div><div class="nm">${next.name}</div></a>
    </div>
    ${siteFooter()}
  `;
}

/* ---------- NEWS ---------- */
function renderNewsList(){
  document.title = "News & Analysis | Courtside Ten";
  const cards = NEWS.map(n=>newsCard(n)).join("");
  return `
    <section class="page-hero">
      <div class="eyebrow">// THE BLOG</div>
      <h1 class="display">NEWS, EXPLAINERS<br>&amp; ANALYSIS</h1>
      <p>Methodology breakdowns, stat explainers, and analysis to go along with the rankings.</p>
    </section>
    <div class="news-grid" style="margin-top:32px;">${cards}</div>
    ${adSlot()}
    ${siteFooter()}
  `;
}

function renderArticle(slug){
  const n = NEWS.find(x=>x.slug===slug);
  if(!n) return notFoundBlock("Article not found.", "#/news", "← Back to news");
  document.title = n.title + " | Courtside Ten";
  const body = n.body.map(par=>`<p>${par}</p>`).join("");
  const idx = NEWS.findIndex(x=>x.slug===slug);
  const others = NEWS.filter((x,i)=>i!==idx).slice(0,2).map(x=>newsCard(x)).join("");
  return `
    <a href="#/news" class="back-link">← ALL ARTICLES</a>
    <section class="page-hero" style="padding-bottom:0; border-bottom:none;">
      <div class="eyebrow">${n.category.toUpperCase()}</div>
      <h1 class="display" style="font-size:clamp(1.9rem,5vw,3rem);">${n.title}</h1>
      <div class="article-meta"><span>${n.date}</span><span>Courtside Ten Staff</span></div>
    </section>
    <div class="prose">${body}</div>
    ${adSlot()}
    <div class="list-head"><h2 class="mono">READ NEXT</h2></div>
    <div class="news-grid">${others}</div>
    ${siteFooter()}
  `;
}

/* ---------- ROUTER ---------- */
function updateActiveNav(hash){
  const links = document.querySelectorAll("#navLinks a");
  let section = "#/";
  if(hash.startsWith("#/rankings")) section = "#/rankings";
  else if(hash.startsWith("#/news")) section = "#/news";
  else if(hash.startsWith("#/about")) section = "#/about";
  else if(hash.startsWith("#/contact")) section = "#/contact";
  links.forEach(a=>{
    a.classList.toggle("active", a.getAttribute("data-route")===section);
  });
}

function router(){
  const hash = location.hash || "#/";
  const app = document.getElementById("app");
  let m;
  if(hash === "#/" || hash === ""){
    app.innerHTML = renderHub();
  } else if(hash === "#/rankings"){
    app.innerHTML = renderRankingsIndex();
  } else if(m = hash.match(/^#\/rankings\/([a-z0-9-]+)\/player\/([a-z0-9-]+)/)){
    app.innerHTML = renderPlayer(m[1], m[2]);
  } else if(m = hash.match(/^#\/rankings\/([a-z0-9-]+)/)){
    app.innerHTML = renderRanking(m[1]);
  } else if(hash === "#/news"){
    app.innerHTML = renderNewsList();
  } else if(m = hash.match(/^#\/news\/([a-z0-9-]+)/)){
    app.innerHTML = renderArticle(m[1]);
  } else if(hash === "#/about"){
    app.innerHTML = renderAbout();
  } else if(hash === "#/contact"){
    app.innerHTML = renderContact();
  } else {
    app.innerHTML = notFoundBlock("That page doesn't exist.", "#/", "← Back home");
  }
  updateActiveNav(hash);
  window.scrollTo({top:0, behavior:"instant"});
}
window.addEventListener("hashchange", router);
window.addEventListener("DOMContentLoaded", router);
</script>
